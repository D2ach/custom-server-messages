name: CustomServerMessages
version: ${version}
main: com.codexmc.customservermessages.CustomServerMessagesPlugin
description: Customizes join, first-join, quit, and kick broadcast messages on Paper and Folia.
author: ohmlnw007, Xin_Yu_Han
api-version: "1.21"
folia-supported: true
softdepend: [LuckPerms, CMI, Vault]
commands:
  customservermessages:
    description: Shows plugin status or reloads the configuration.
    usage: /<command> [status|reload]
    aliases: [csmessages, csm]
    permission: customservermessages.admin
permissions:
  customservermessages.admin:
    description: Allows using CustomServerMessages admin commands.
    default: op
